<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestrator pomiarów ciśnienia</title>
    <!-- Ładowanie bibliotek jsPDF i autoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        /* Podstawowe style dla dark mode */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1, h2 {
            text-align: center;
            color: #f0f0f0;
            margin-bottom: 20px;
        }
        
        /* Kontener centralny dla formularza */
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        
        /* Style formularza */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        label {
            font-weight: 500;
            color: #e0e0e0;
            margin-bottom: 5px;
        }
        
        input[type="number"] {
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #3a3a3a;
            color: #f0f0f0;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }
        
        /* Kontener przycisków zarządzania bazą */
        .database-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 500px;
            width: 100%;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        
        button:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }
        
        /* Specyficzne style dla przycisków bazy */
        #clearButton {
            background-color: #dc3545;
        }
        
        #clearButton:hover {
            background-color: #c82333;
        }
        
        #importButton {
            background-color: #28a745;
        }
        
        #importButton:hover {
            background-color: #218838;
        }
        
        /* Input file ukryty */
        #fileInput {
            display: none;
        }
        
        /* Lista historii */
        #measurementsList {
            list-style: none;
            padding: 0;
            max-width: 500px;
            width: 100%;
        }
        
        #measurementsList li {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        #measurementsList li button {
            background-color: #dc3545;
            padding: 6px 12px;
            font-size: 14px;
        }
        
        #measurementsList li button:hover {
            background-color: #c82333;
        }
        
        /* Responsywność */
        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            .database-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h1>Rejestrator pomiarów ciśnienia krwi</h1>
    
    <div class="container">
        <form id="measurementForm">
            <label for="systolic">Ciśnienie skurczowe (mmHg):</label>
            <input type="number" id="systolic" min="50" max="250" required>
            
            <label for="diastolic">Ciśnienie rozkurczowe (mmHg):</label>
            <input type="number" id="diastolic" min="30" max="150" required>
            
            <button type="submit">Zapisz pomiar</button>
        </form>
    </div>
    
    <div class="database-controls">
        <button id="exportPdfButton" onclick="exportToPdf()">Utwórz plik PDF z bazy danych</button>
        <button id="clearButton" onclick="clearDatabase()">Wyczyść bazę danych</button>
        <label for="fileInput" id="importButton" class="button-like">Importuj bazę z pliku JSON</label>
        <input type="file" id="fileInput" accept=".json" onchange="importFromFile(event)">
    </div>
    
    <h2>Historia pomiarów</h2>
    <ul id="measurementsList"></ul>
    
    <script src="script.js"></script>
</body>
</html>
